repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.2.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: shellcheck
        name: shellcheck
        description: "Run 'shellcheck' to format bash code"
        entry: 'shellcheck'
        language: unsupported
        files: '^.*\.sh$'

      - id: shfmt
        name: shfmt
        description: "Run 'shfmt' to format bash code"
        entry: 'shfmt -w'
        language: unsupported
        files: '^.*\.sh'
